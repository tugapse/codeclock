[package]
name = "codeclock"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11.11"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
log = "0.4.35"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3"
tiny_http = "0.12"
toml = "1.2.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
x11rb = "0.14.0"
zbus = "5"

[dev-dependencies]
tempfile = "3.27.0"
